<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 400" role="img" aria-labelledby="sw-title">
  <title id="sw-title">Stream workspace and live view</title>
  <defs>
    <filter id="sw-sh" x="-2%" y="-2%" width="104%" height="104%">
      <feDropShadow dx="0" dy="1" stdDeviation="3" flood-opacity="0.1"/>
    </filter>
  </defs>
  <rect width="920" height="400" fill="#f1f5f9" rx="16"/>
  <text x="40" y="40" font-family="system-ui,sans-serif" font-size="20" font-weight="700" fill="#0f172a">Stream workspace &amp; live view</text>

  <rect x="40" y="64" width="200" height="300" rx="12" fill="#0f172a" filter="url(#sw-sh)"/>
  <text x="140" y="96" font-family="system-ui,sans-serif" font-size="12" font-weight="600" fill="#94a3b8" text-anchor="middle">Streams panel</text>
  <rect x="56" y="112" width="168" height="48" rx="8" fill="#1e293b" stroke="#14b8a6"/>
  <text x="72" y="132" font-size="10" fill="#5eead4" font-family="system-ui,sans-serif">KAFKA</text>
  <text x="72" y="148" font-size="11" fill="#e2e8f0" font-family="system-ui,sans-serif">orders.events</text>
  <rect x="56" y="168" width="168" height="48" rx="8" fill="#1e293b" stroke="#334155"/>
  <text x="72" y="188" font-size="10" fill="#94a3b8" font-family="system-ui,sans-serif">KINESIS</text>
  <text x="72" y="204" font-size="11" fill="#cbd5e1" font-family="system-ui,sans-serif">clickstream</text>
  <text x="140" y="340" font-family="system-ui,sans-serif" font-size="9" fill="#64748b" text-anchor="middle">Cookie persistence</text>

  <rect x="260" y="64" width="620" height="300" rx="12" fill="#fff" stroke="#cbd5e1" filter="url(#sw-sh)"/>
  <text x="280" y="96" font-family="system-ui,sans-serif" font-size="13" font-weight="600" fill="#0f172a">Live stream</text>
  <rect x="280" y="112" width="580" height="36" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="296" y="135" font-family="system-ui,sans-serif" font-size="10" fill="#64748b">Header regex · Body regex · Timed window · Pause · Export JSON / CSV / NDJSON</text>
  <rect x="280" y="160" width="580" height="180" rx="8" fill="#0f172a"/>
  <rect x="296" y="176" width="548" height="28" rx="4" fill="#1e293b"/>
  <text x="308" y="195" font-family="ui-monospace,monospace" font-size="10" fill="#5eead4">trace-id: abc · topic: orders.events</text>
  <rect x="296" y="212" width="548" height="28" rx="4" fill="#134e4a"/>
  <text x="308" y="231" font-family="ui-monospace,monospace" font-size="10" fill="#99f6e4">{"orderId":42,"status":"shipped"}</text>
  <rect x="296" y="248" width="548" height="28" rx="4" fill="#1e293b"/>
  <text x="308" y="267" font-family="ui-monospace,monospace" font-size="10" fill="#94a3b8">… streaming via WebSocket /ws/stream</text>
  <path d="M240 200h16" stroke="#0d9488" stroke-width="2"/>
  <text x="252" y="192" font-size="9" fill="#0d9488" font-family="system-ui,sans-serif">sync</text>
</svg>
