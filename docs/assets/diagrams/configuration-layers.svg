<svg xmlns="http://www.w3.org/2000/svg" width="960" height="350" viewBox="0 0 960 350" role="img" aria-labelledby="title desc"><title id="title">Three configuration surfaces</title><desc id="desc">Choose the right configuration layer before changing a value.</desc><rect width="960" height="350" rx="12" fill="#0c111b"/><g font-family="Segoe UI,Arial,sans-serif"><text x="30" y="45" fill="#edf3ff" font-size="24" font-weight="600">Three configuration surfaces</text><text x="30" y="72" fill="#93a4bf" font-size="14">Choose the right configuration layer before changing a value.</text><g transform="translate(30 100)"><rect width="280" height="145" rx="10" fill="#142238" stroke="#35557e"/><text x="20" y="30" fill="#75a7ff" font-size="12" font-family="monospace">01</text><text x="20" y="65" fill="#edf3ff" font-size="21" font-weight="600">Build / image</text><text x="20" y="95" fill="#b7c4da" font-size="14">Provider modules in the image</text><text x="20" y="119" fill="#b7c4da" font-size="14">Maven profiles or image tags</text></g><path d="M312 171h24m-7-6 7 6-7 6" fill="none" stroke="#75a7ff" stroke-width="2"/><g transform="translate(340 100)"><rect width="280" height="145" rx="10" fill="#142238" stroke="#35557e"/><text x="20" y="30" fill="#75a7ff" font-size="12" font-family="monospace">02</text><text x="20" y="65" fill="#edf3ff" font-size="21" font-weight="600">Deployment</text><text x="20" y="95" fill="#b7c4da" font-size="14">Mode, auth, limits, persistence</text><text x="20" y="119" fill="#b7c4da" font-size="14">Spring properties / Helm values</text></g><path d="M622 171h24m-7-6 7 6-7 6" fill="none" stroke="#75a7ff" stroke-width="2"/><g transform="translate(650 100)"><rect width="280" height="145" rx="10" fill="#142238" stroke="#35557e"/><text x="20" y="30" fill="#75a7ff" font-size="12" font-family="monospace">03</text><text x="20" y="65" fill="#edf3ff" font-size="21" font-weight="600">Connection</text><text x="20" y="95" fill="#b7c4da" font-size="14">Broker address and credentials</text><text x="20" y="119" fill="#b7c4da" font-size="14">Saved profile for each broker</text></g><path d="M30 275h900" stroke="#26354c"/><text x="30" y="310" fill="#93a4bf" font-size="14">Runtime enabled-protocols can select installed providers; it cannot add a missing provider module.</text></g></svg>