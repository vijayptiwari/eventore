openapi: 3.0.3
info:
  title: Eventore common schemas
  version: 0.3.0
components:
  parameters:
    connectionId:
      name: connectionId
      in: path
      required: true
      schema:
        type: string
  schemas:
    ProtocolType:
      type: string
      enum:
        - KAFKA
        - MQTT
        - JMS
        - PULSAR
        - RABBITMQ
        - KINESIS
        - GCP_PUBSUB
        - AZURE_SERVICE_BUS
    AppConfigResponse:
      type: object
      properties:
        deploymentMode:
          type: string
          enum: [ADMIN, DEV, READONLY]
        allowedActions:
          type: array
          items:
            type: string
        supportedProtocols:
          type: array
          items:
            $ref: '#/components/schemas/ProtocolType'
        loadedModules:
          type: array
          items:
            type: string
    ProviderInfoDto:
      type: object
      properties:
        protocol:
          $ref: '#/components/schemas/ProtocolType'
        moduleId:
          type: string
        hasInspector:
          type: boolean
        connectorClass:
          type: string
    ConnectionProfile:
      type: object
      required: [name, protocol, brokerUrl]
      properties:
        id:
          type: string
        name:
          type: string
        protocol:
          $ref: '#/components/schemas/ProtocolType'
        cloudProvider:
          type: string
        streamPlatform:
          type: string
        brokerUrl:
          type: string
        properties:
          type: object
          additionalProperties:
            type: string
        credentials:
          type: object
          additionalProperties:
            type: string
    ConnectionProfileResponse:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        protocol:
          $ref: '#/components/schemas/ProtocolType'
        cloudProvider:
          type: string
        streamPlatform:
          type: string
        brokerUrl:
          type: string
        properties:
          type: object
          additionalProperties:
            type: string
        hasCredentials:
          type: boolean
    TopicRef:
      type: object
      properties:
        name:
          type: string
        type:
          type: string
        protocol:
          $ref: '#/components/schemas/ProtocolType'
    PublishRequest:
      type: object
      properties:
        destination:
          type: string
        payload:
          type: string
        key:
          type: string
        partition:
          type: integer
        headers:
          type: object
          additionalProperties:
            type: string
    SubscribeRequest:
      type: object
      properties:
        destination:
          type: string
        consumerGroup:
          type: string
        options:
          type: object
          additionalProperties:
            type: string
    MessageSearchRequest:
      type: object
      properties:
        topic:
          type: string
        topics:
          type: array
          items:
            type: string
        maxMessages:
          type: integer
        startAt:
          type: string
        headerRegex:
          type: string
        bodyRegex:
          type: string
    StreamPlatformPreset:
      type: object
      properties:
        platform:
          type: string
        label:
          type: string
        description:
          type: string
        protocol:
          $ref: '#/components/schemas/ProtocolType'
        cloudProvider:
          type: string
        brokerUrlHint:
          type: string
        defaultProperties:
          type: object
          additionalProperties:
            type: string
    StatusResponse:
      type: object
      additionalProperties:
        type: string
    UnifiedMessage:
      type: object
      properties:
        id:
          type: string
        destination:
          type: string
        timestamp:
          type: string
          format: date-time
        key:
          type: string
        payload:
          type: string
        headers:
          type: object
          additionalProperties:
            type: string
        attributes:
          type: object
          additionalProperties:
            type: string
    ProtocolInspectCapabilities:
      type: object
      properties:
        features:
          type: array
          items:
            type: string
          description: Inspect feature tokens (see docs/INSPECTOR_PARITY.md)
    SubscriptionDiagnostic:
      type: object
      properties:
        subscriptionId:
          type: string
        connectionId:
          type: string
        connectionName:
          type: string
        protocol:
          $ref: '#/components/schemas/ProtocolType'
        destination:
          type: string
        transport:
          type: string
          enum: [SSE, WS]
        messageCount:
          type: integer
        lastError:
          type: string
          nullable: true
        startedAt:
          type: string
        status:
          type: string
          enum: [ACTIVE, SLOW_CONSUMER, ERROR]
    ValidationRecord:
      type: object
      properties:
        timestamp:
          type: string
        status:
          type: string
          enum: [OK, FAILED]
        message:
          type: string
          nullable: true
    ConsumerGroupSummary:
      type: object
      properties:
        groupId:
          type: string
        state:
          type: string
        protocolType:
          type: string
        memberCount:
          type: integer
        attributes:
          type: object
          additionalProperties:
            type: string
    GroupOffset:
      type: object
      properties:
        topic:
          type: string
        partition:
          type: integer
        offset:
          type: integer
          format: int64
        logEndOffset:
          type: integer
          format: int64
        lag:
          type: integer
          format: int64
        oldestUnackedMessageAge:
          type: integer
          format: int64
          nullable: true
    ClusterInfo:
      type: object
      properties:
        clusterId:
          type: string
        brokers:
          type: array
          items:
            type: object
        attributes:
          type: object
          additionalProperties:
            type: string
    TopicDetail:
      type: object
      properties:
        name:
          type: string
        partitionCount:
          type: integer
        replicationFactor:
          type: integer
        partitions:
          type: array
          items:
            type: object
        config:
          type: object
          additionalProperties:
            type: string
    ConsumerGroupDetail:
      type: object
      properties:
        groupId:
          type: string
        state:
          type: string
        partitionAssignor:
          type: string
        members:
          type: array
          items:
            type: object
        offsets:
          type: array
          items:
            $ref: '#/components/schemas/GroupOffset'
    ConnectionStoreType:
      type: string
      enum:
        - FILE
        - JDBC
        - K8S_CRD
        - IN_MEMORY
    ConnectionStoreInfo:
      type: object
      required:
        - type
        - description
        - supportsOptimisticLocking
        - readOnly
        - profileCount
        - availableStores
      properties:
        type:
          $ref: '#/components/schemas/ConnectionStoreType'
        description:
          type: string
        supportsOptimisticLocking:
          type: boolean
        readOnly:
          type: boolean
        profileCount:
          type: integer
        availableStores:
          type: array
          items:
            $ref: '#/components/schemas/ConnectionStoreType'
    ReplicationBridgeState:
      type: string
      enum:
        - RUNNING
        - STOPPED
        - ERROR
        - PAUSED
    ReplicationBridgeStats:
      type: object
      required:
        - totalReplicated
        - bytesReplicated
        - errorsCount
        - state
      properties:
        totalReplicated:
          type: integer
          format: int64
        bytesReplicated:
          type: integer
          format: int64
        errorsCount:
          type: integer
          format: int64
        lastReplicatedAt:
          type: string
        lastError:
          type: string
        state:
          $ref: '#/components/schemas/ReplicationBridgeState'
    ReplicationBridge:
      type: object
      required:
        - id
        - name
        - sourceConnectionId
        - sourceDestination
        - targetConnectionId
        - targetDestination
        - loopPrevention
        - enabled
        - createdAt
        - stats
      properties:
        id:
          type: string
        name:
          type: string
        sourceConnectionId:
          type: string
        sourceDestination:
          type: string
        targetConnectionId:
          type: string
        targetDestination:
          type: string
        headerTransform:
          type: object
          additionalProperties:
            type: string
        payloadFilter:
          type: string
        loopPrevention:
          type: boolean
        enabled:
          type: boolean
        createdAt:
          type: string
        stats:
          $ref: '#/components/schemas/ReplicationBridgeStats'
    ReplicationBridgeRequest:
      type: object
      required:
        - name
        - sourceConnectionId
        - sourceDestination
        - targetConnectionId
        - targetDestination
      properties:
        name:
          type: string
        sourceConnectionId:
          type: string
        sourceDestination:
          type: string
        targetConnectionId:
          type: string
        targetDestination:
          type: string
        headerTransform:
          type: object
          additionalProperties:
            type: string
        payloadFilter:
          type: string
        loopPrevention:
          type: boolean
        autoStart:
          type: boolean
    ReplicationTestRequest:
      type: object
      properties:
        headers:
          type: object
          additionalProperties:
            type: string
        payload:
          type: string
        headerTransform:
          type: object
          additionalProperties:
            type: string
        payloadFilter:
          type: string
        loopPrevention:
          type: boolean
        bridgeId:
          type: string
    ReplicationTestResult:
      type: object
      required:
        - passedFilter
        - loopDetected
        - filterReason
      properties:
        passedFilter:
          type: boolean
        loopDetected:
          type: boolean
        transformedHeaders:
          type: object
          additionalProperties:
            type: string
        transformedPayload:
          type: string
        filterReason:
          type: string
