openapi: 3.0.3
info:
  title: Eventore Core API
  description: |
    Protocol-agnostic control plane: config, connections, messaging, subscriptions.
    x-eventore-stream: core
    x-eventore-module: eventore-server
  version: 0.1.0
servers:
  - url: /api/v1
tags:
  - name: Config
  - name: Platforms
  - name: Providers
  - name: Connections
  - name: Destinations
  - name: Publish
  - name: Subscribe
paths:
  /config:
    get:
      tags: [Config]
      operationId: getConfig
      summary: Deployment mode and enabled protocols
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '../common/schemas.yaml#/components/schemas/AppConfigResponse'
  /platforms:
    get:
      tags: [Platforms]
      operationId: listPlatforms
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '../common/schemas.yaml#/components/schemas/StreamPlatformPreset'
  /providers:
    get:
      tags: [Providers]
      operationId: listProviders
      summary: Loaded stream provider modules
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '../common/schemas.yaml#/components/schemas/ProviderInfoDto'
  /connections:
    get:
      tags: [Connections]
      operationId: listConnections
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '../common/schemas.yaml#/components/schemas/ConnectionProfileResponse'
    post:
      tags: [Connections]
      operationId: createConnection
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../common/schemas.yaml#/components/schemas/ConnectionProfile'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '../common/schemas.yaml#/components/schemas/ConnectionProfileResponse'
  /connections/{connectionId}:
    parameters:
      - $ref: '../common/schemas.yaml#/components/parameters/connectionId'
    get:
      tags: [Connections]
      operationId: getConnection
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '../common/schemas.yaml#/components/schemas/ConnectionProfileResponse'
    put:
      tags: [Connections]
      operationId: updateConnection
      requestBody:
        content:
          application/json:
            schema:
              $ref: '../common/schemas.yaml#/components/schemas/ConnectionProfile'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '../common/schemas.yaml#/components/schemas/ConnectionProfileResponse'
    delete:
      tags: [Connections]
      operationId: deleteConnection
      responses:
        '204':
          description: Deleted
  /connections/{connectionId}/validate:
    parameters:
      - $ref: '../common/schemas.yaml#/components/parameters/connectionId'
    post:
      tags: [Connections]
      operationId: validateConnection
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '../common/schemas.yaml#/components/schemas/StatusResponse'
  /connections/{connectionId}/destinations:
    parameters:
      - $ref: '../common/schemas.yaml#/components/parameters/connectionId'
    get:
      tags: [Destinations]
      operationId: listDestinations
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '../common/schemas.yaml#/components/schemas/TopicRef'
  /connections/{connectionId}/publish:
    parameters:
      - $ref: '../common/schemas.yaml#/components/parameters/connectionId'
    post:
      tags: [Publish]
      operationId: publishMessage
      requestBody:
        content:
          application/json:
            schema:
              $ref: '../common/schemas.yaml#/components/schemas/PublishRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '../common/schemas.yaml#/components/schemas/StatusResponse'
  /connections/{connectionId}/subscribe:
    parameters:
      - $ref: '../common/schemas.yaml#/components/parameters/connectionId'
    post:
      tags: [Subscribe]
      operationId: startSubscription
      requestBody:
        content:
          application/json:
            schema:
              $ref: '../common/schemas.yaml#/components/schemas/SubscribeRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '../common/schemas.yaml#/components/schemas/StatusResponse'
  /connections/{connectionId}/subscribe/{subscriptionId}:
    parameters:
      - $ref: '../common/schemas.yaml#/components/parameters/connectionId'
      - name: subscriptionId
        in: path
        required: true
        schema:
          type: string
    delete:
      tags: [Subscribe]
      operationId: stopSubscription
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '../common/schemas.yaml#/components/schemas/StatusResponse'
