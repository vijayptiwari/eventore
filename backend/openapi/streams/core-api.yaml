openapi: 3.0.3
info:
  title: Eventore Core API
  description: |
    Protocol-agnostic control plane: config, connections, messaging, subscriptions.
    x-eventore-stream: core
    x-eventore-module: eventore-server
  version: 0.2.1
servers:
  - url: /api/v1
tags:
  - name: Config
  - name: Platforms
  - name: Providers
  - name: Connections
  - name: Destinations
  - name: Publish
  - name: Subscribe
  - name: Bridges
paths:
  /config:
    get:
      tags: [Config]
      operationId: getConfig
      summary: Deployment mode and enabled protocols
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '../common/schemas.yaml#/components/schemas/AppConfigResponse'
  /platforms:
    get:
      tags: [Platforms]
      operationId: listPlatforms
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '../common/schemas.yaml#/components/schemas/StreamPlatformPreset'
  /providers:
    get:
      tags: [Providers]
      operationId: listProviders
      summary: Loaded stream provider modules
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '../common/schemas.yaml#/components/schemas/ProviderInfoDto'
  /connections:
    get:
      tags: [Connections]
      operationId: listConnections
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '../common/schemas.yaml#/components/schemas/ConnectionProfileResponse'
    post:
      tags: [Connections]
      operationId: createConnection
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../common/schemas.yaml#/components/schemas/ConnectionProfile'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '../common/schemas.yaml#/components/schemas/ConnectionProfileResponse'
  /connections/store:
    get:
      tags: [Connections]
      operationId: getConnectionStoreInfo
      summary: Get active connection persistence store metadata and capabilities
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '../common/schemas.yaml#/components/schemas/ConnectionStoreInfo'
  /connections/store/migrate:
    post:
      tags: [Connections]
      operationId: migrateConnectionStore
      summary: Migrate connection profiles from active store to target store
      parameters:
        - name: targetType
          in: query
          required: true
          schema:
            $ref: '../common/schemas.yaml#/components/schemas/ConnectionStoreType'
      responses:
        '200':
          description: Migration completed successfully
          content:
            application/json:
              schema:
                $ref: '../common/schemas.yaml#/components/schemas/ConnectionStoreInfo'
  /connections/{connectionId}:
    parameters:
      - $ref: '../common/schemas.yaml#/components/parameters/connectionId'
    get:
      tags: [Connections]
      operationId: getConnection
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '../common/schemas.yaml#/components/schemas/ConnectionProfileResponse'
    put:
      tags: [Connections]
      operationId: updateConnection
      requestBody:
        content:
          application/json:
            schema:
              $ref: '../common/schemas.yaml#/components/schemas/ConnectionProfile'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '../common/schemas.yaml#/components/schemas/ConnectionProfileResponse'
    delete:
      tags: [Connections]
      operationId: deleteConnection
      responses:
        '204':
          description: Deleted
  /connections/{connectionId}/validate:
    parameters:
      - $ref: '../common/schemas.yaml#/components/parameters/connectionId'
    post:
      tags: [Connections]
      operationId: validateConnection
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '../common/schemas.yaml#/components/schemas/StatusResponse'
  /connections/{connectionId}/destinations:
    parameters:
      - $ref: '../common/schemas.yaml#/components/parameters/connectionId'
    get:
      tags: [Destinations]
      operationId: listDestinations
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '../common/schemas.yaml#/components/schemas/TopicRef'
  /connections/{connectionId}/publish:
    parameters:
      - $ref: '../common/schemas.yaml#/components/parameters/connectionId'
    post:
      tags: [Publish]
      operationId: publishMessage
      requestBody:
        content:
          application/json:
            schema:
              $ref: '../common/schemas.yaml#/components/schemas/PublishRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '../common/schemas.yaml#/components/schemas/StatusResponse'
  /connections/{connectionId}/subscribe:
    parameters:
      - $ref: '../common/schemas.yaml#/components/parameters/connectionId'
    post:
      tags: [Subscribe]
      operationId: startSubscription
      requestBody:
        content:
          application/json:
            schema:
              $ref: '../common/schemas.yaml#/components/schemas/SubscribeRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '../common/schemas.yaml#/components/schemas/StatusResponse'
  /connections/{connectionId}/subscribe/{subscriptionId}:
    parameters:
      - $ref: '../common/schemas.yaml#/components/parameters/connectionId'
      - name: subscriptionId
        in: path
        required: true
        schema:
          type: string
    delete:
      tags: [Subscribe]
      operationId: stopSubscription
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '../common/schemas.yaml#/components/schemas/StatusResponse'
  /bridges:
    get:
      tags: [Bridges]
      operationId: listBridges
      summary: List all cross-broker replication bridges
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '../common/schemas.yaml#/components/schemas/ReplicationBridge'
    post:
      tags: [Bridges]
      operationId: createBridge
      summary: Create a new replication bridge
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../common/schemas.yaml#/components/schemas/ReplicationBridgeRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '../common/schemas.yaml#/components/schemas/ReplicationBridge'
  /bridges/{bridgeId}:
    parameters:
      - name: bridgeId
        in: path
        required: true
        schema:
          type: string
    get:
      tags: [Bridges]
      operationId: getBridge
      summary: Get details and live throughput stats of a replication bridge
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '../common/schemas.yaml#/components/schemas/ReplicationBridge'
    put:
      tags: [Bridges]
      operationId: updateBridge
      summary: Update a replication bridge configuration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../common/schemas.yaml#/components/schemas/ReplicationBridgeRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '../common/schemas.yaml#/components/schemas/ReplicationBridge'
    delete:
      tags: [Bridges]
      operationId: deleteBridge
      summary: Stop and delete a replication bridge
      responses:
        '204':
          description: Deleted
  /bridges/{bridgeId}/start:
    parameters:
      - name: bridgeId
        in: path
        required: true
        schema:
          type: string
    post:
      tags: [Bridges]
      operationId: startBridge
      summary: Start or resume cross-broker message replication
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '../common/schemas.yaml#/components/schemas/ReplicationBridge'
  /bridges/{bridgeId}/stop:
    parameters:
      - name: bridgeId
        in: path
        required: true
        schema:
          type: string
    post:
      tags: [Bridges]
      operationId: stopBridge
      summary: Stop cross-broker message replication
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '../common/schemas.yaml#/components/schemas/ReplicationBridge'
  /bridges/test:
    post:
      tags: [Bridges]
      operationId: testBridge
      summary: Dry-run test replication transform and filter rules
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../common/schemas.yaml#/components/schemas/ReplicationTestRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '../common/schemas.yaml#/components/schemas/ReplicationTestResult'
