name: Build and publish artifacts

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/eventore-backend
  FRONTEND_IMAGE: ghcr.io/${{ github.repository_owner }}/eventore-frontend
  MCP_IMAGE: ghcr.io/${{ github.repository_owner }}/eventore-mcp

jobs:
  build-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Maven package (compile all modules)
        working-directory: backend
        run: mvn -B -DskipTests package

  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: npm ci and build
        working-directory: frontend
        run: npm ci && npm run build

  helm-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.14.4
      - name: Lint and template charts
        run: |
          helm lint deploy/helm/eventore
          helm lint deploy/helm/eventore-mcp
          helm template eventore deploy/helm/eventore -f deploy/helm/eventore/values-dev.yaml > /dev/null
          helm template eventore deploy/helm/eventore -f deploy/helm/eventore/values-kafka-kinesis.yaml > /dev/null
          helm template eventore deploy/helm/eventore -f deploy/helm/eventore/values-stream-kafka.yaml > /dev/null

  prepare-backend-matrix:
    runs-on: ubuntu-latest
    outputs:
      include: ${{ steps.set.outputs.include }}
    steps:
      - uses: actions/checkout@v4
      - id: set
        run: |
          INCLUDE=$(jq -c '.' deploy/ci-backend-images.json)
          echo "include=$INCLUDE" >> "$GITHUB_OUTPUT"

  publish-backend-images:
    needs: [build-backend, helm-lint, prepare-backend-matrix]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.prepare-backend-matrix.outputs.include) }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.BACKEND_IMAGE }}
          tags: |
            type=sha,prefix=
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=${{ matrix.tag }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.backend
          push: true
          build-args: EVENTORE_STREAM_PROFILES=${{ matrix.profiles }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  publish-console-images:
    needs: [build-frontend, helm-lint]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: frontend
            file: docker/Dockerfile.frontend
            image: ${{ env.FRONTEND_IMAGE }}
          - name: mcp
            file: docker/Dockerfile.mcp
            image: ${{ env.MCP_IMAGE }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ matrix.image }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  publish-helm:
    needs: [publish-backend-images, publish-console-images]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.14.4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Package Helm charts
        run: |
          mkdir -p helm-packages
          helm package deploy/helm/eventore -d helm-packages
          helm package deploy/helm/eventore-mcp -d helm-packages
      - uses: actions/upload-artifact@v4
        with:
          name: helm-charts
          path: helm-packages/*.tgz
          if-no-files-found: error
      - name: Push charts to GHCR (OCI)
        run: |
          for chart in helm-packages/*.tgz; do
            helm push "$chart" "oci://ghcr.io/${{ github.repository_owner }}/charts"
          done
