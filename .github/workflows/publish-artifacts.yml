name: Build and publish artifacts

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/eventore-backend
  FRONTEND_IMAGE: ghcr.io/${{ github.repository_owner }}/eventore-frontend
  MCP_IMAGE: ghcr.io/${{ github.repository_owner }}/eventore-mcp

jobs:
  version-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/sync-version.mjs --check

  build-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Maven package (compile and unit test all modules)
        working-directory: backend
        run: mvn -B package

  backend-integration-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Testcontainers broker tests (Kafka, RabbitMQ, MQTT, Pulsar, JMS)
        working-directory: backend
        run: mvn -B test -DexcludedTestGroups= -pl eventore-provider-kafka,eventore-provider-rabbitmq,eventore-provider-mqtt,eventore-provider-pulsar,eventore-provider-jms -am

  build-mcp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: mcp/eventore-mcp/package-lock.json
      - name: npm ci and test
        working-directory: mcp/eventore-mcp
        run: |
          npm ci
          npm test

  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: npm ci, test and build
        working-directory: frontend
        run: |
          npm ci
          npm run check:openapi
          npm test
          npm run build

  build-frontend-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Playwright mocked smoke
        working-directory: frontend
        run: |
          npm ci
          npx playwright install chromium --with-deps
          npm run test:e2e

  build-frontend-e2e-live:
    runs-on: ubuntu-latest
    needs: [build-backend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Start Redpanda Kafka broker
        run: |
          docker compose -f docker/docker-compose.brokers.yml up -d redpanda
      - name: Build and launch Eventore backend
        run: |
          mvn -B -f backend/pom.xml package -DskipTests -pl eventore-server -am
          nohup java -jar backend/eventore-server/target/eventore-server-*.jar > backend.log 2>&1 &
          for i in {1..60}; do
            if curl -fsS http://localhost:8080/api/v1/config | grep -q "deploymentMode"; then
              echo "Backend is ready"
              exit 0
            fi
            echo "Waiting for backend..."
            sleep 2
          done
          cat backend.log
          exit 1
      - name: Run Playwright Live E2E
        working-directory: frontend
        env:
          EVENTORE_REQUIRE_LIVE_BACKEND: 'true'
        run: |
          npm ci
          npx playwright install chromium --with-deps
          npm run test:e2e:live

  helm-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.14.4
      - name: Lint and template charts
        run: |
          helm lint deploy/helm/eventore
          helm lint deploy/helm/eventore-mcp
          helm template eventore deploy/helm/eventore -f deploy/helm/eventore/values-dev.yaml > /dev/null
          helm template eventore deploy/helm/eventore -f deploy/helm/eventore/values-kafka-kinesis.yaml > /dev/null
          helm template eventore deploy/helm/eventore -f deploy/helm/eventore/values-stream-kafka.yaml > /dev/null

  prepare-backend-matrix:
    runs-on: ubuntu-latest
    outputs:
      include: ${{ steps.set.outputs.include }}
    steps:
      - uses: actions/checkout@v4
      - id: set
        run: |
          INCLUDE=$(jq -c '.' deploy/ci-backend-images.json)
          {
            echo 'include<<MATRIX_EOF'
            echo "$INCLUDE"
            echo 'MATRIX_EOF'
          } >> "$GITHUB_OUTPUT"

  publish-backend-images:
    needs: [version-check, build-backend, backend-integration-tests, build-mcp, build-frontend, build-frontend-e2e, build-frontend-e2e-live, helm-lint, prepare-backend-matrix]
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.prepare-backend-matrix.outputs.include) }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.BACKEND_IMAGE }}
          flavor: latest=false
          tags: |
            type=sha,prefix=sha-,suffix=-${{ matrix.tag }}
            type=semver,pattern={{version}},suffix=-${{ matrix.tag }}
            type=raw,value=${{ matrix.tag }},enable={{is_default_branch}}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.backend
          push: true
          build-args: EVENTORE_STREAM_PROFILES=${{ matrix.profiles }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  publish-console-images:
    needs: [version-check, build-backend, backend-integration-tests, build-frontend, build-mcp, build-frontend-e2e, build-frontend-e2e-live, helm-lint]
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: frontend
            file: docker/Dockerfile.frontend
            image: ghcr.io/${{ github.repository_owner }}/eventore-frontend
          - name: mcp
            file: docker/Dockerfile.mcp
            image: ghcr.io/${{ github.repository_owner }}/eventore-mcp
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ matrix.image }}
          flavor: latest=false
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  publish-helm:
    needs: [publish-backend-images, publish-console-images]
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.14.4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Package Helm charts
        run: |
          mkdir -p helm-packages
          VERSION=$(cat VERSION | tr -d '\r\n')
          APP_VERSION="$VERSION"
          if [[ "$GITHUB_REF_TYPE" != "tag" ]]; then
            VERSION="$VERSION-dev.$GITHUB_RUN_NUMBER"
            APP_VERSION="sha-${GITHUB_SHA:0:7}"
          fi
          helm package deploy/helm/eventore --version "$VERSION" --app-version "$APP_VERSION" -d helm-packages
          helm package deploy/helm/eventore-mcp --version "$VERSION" --app-version "$APP_VERSION" -d helm-packages
      - uses: actions/upload-artifact@v4
        with:
          name: helm-charts
          path: helm-packages/*.tgz
          if-no-files-found: error
      - name: Push charts to GHCR (OCI)
        run: |
          for chart in helm-packages/*.tgz; do
            helm push "$chart" "oci://ghcr.io/${{ github.repository_owner }}/charts"
          done

  publish-release:
    needs: [publish-helm]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: helm-charts
          path: helm-packages
      - name: Publish verified versioned release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sha256sum helm-packages/*.tgz > helm-packages/SHA256SUMS
          gh release create "$GITHUB_REF_NAME" helm-packages/*.tgz helm-packages/SHA256SUMS --verify-tag --title "EventOre $GITHUB_REF_NAME" --notes-file docs/product/RELEASE-NOTES.md
