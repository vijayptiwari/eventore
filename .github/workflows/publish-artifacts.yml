name: Build and publish artifacts

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/eventore-backend
  FRONTEND_IMAGE: ghcr.io/${{ github.repository_owner }}/eventore-frontend
  MCP_IMAGE: ghcr.io/${{ github.repository_owner }}/eventore-mcp
  HELM_OCI: oci://ghcr.io/${{ github.repository_owner }}/charts

jobs:
  build-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Maven package (all providers)
        working-directory: backend
        run: mvn -B -DskipTests package

  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: npm ci and build
        working-directory: frontend
        run: npm ci && npm run build

  helm-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.14.4
      - name: Lint and template charts
        run: |
          helm lint deploy/helm/eventore
          helm lint deploy/helm/eventore-mcp
          helm template eventore deploy/helm/eventore -f deploy/helm/eventore/values-dev.yaml > /dev/null
          helm template eventore-mcp deploy/helm/eventore-mcp > /dev/null

  publish-images:
    needs: [build-backend, build-frontend, helm-lint]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            file: docker/Dockerfile.backend
            image: ghcr.io/${{ github.repository_owner }}/eventore-backend
            maven_profile: providers-all
            extra_tag: ""
          - name: backend-kafka-kinesis
            file: docker/Dockerfile.backend
            image: ghcr.io/${{ github.repository_owner }}/eventore-backend
            maven_profile: kafka-kinesis
            extra_tag: kafka-kinesis
          - name: frontend
            file: docker/Dockerfile.frontend
            image: ghcr.io/${{ github.repository_owner }}/eventore-frontend
            maven_profile: ""
            extra_tag: ""
          - name: mcp
            file: docker/Dockerfile.mcp
            image: ghcr.io/${{ github.repository_owner }}/eventore-mcp
            maven_profile: ""
            extra_tag: ""
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ matrix.image }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ matrix.extra_tag }},enable=${{ matrix.extra_tag != '' }}
      - name: Set backend Maven profile build-arg
        id: backend_build_args
        if: matrix.maven_profile != ''
        run: echo "args=EVENTORE_MAVEN_PROFILES=${{ matrix.maven_profile }}" >> "$GITHUB_OUTPUT"
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          push: true
          build-args: ${{ steps.backend_build_args.outputs.args }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  publish-helm:
    needs: [publish-images]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.14.4
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Package Helm charts
        run: |
          mkdir -p .helm-packages
          helm package deploy/helm/eventore -d .helm-packages
          helm package deploy/helm/eventore-mcp -d .helm-packages
      - uses: actions/upload-artifact@v4
        with:
          name: helm-charts
          path: .helm-packages/
          if-no-files-found: error
      - name: Push charts to GHCR (OCI)
        run: |
          for chart in .helm-packages/*.tgz; do
            helm push "$chart" "oci://ghcr.io/${{ github.repository_owner }}/charts"
          done
