# Deploy product documentation from /docs to GitHub Pages
name: Deploy documentation site

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/docs-pages.yml'
  workflow_dispatch:
  workflow_run:
    workflows: ['Build and publish artifacts']
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event != 'pull_request')
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Inject SEO metadata
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node docs/scripts/sync-release.mjs
          node docs/scripts/build-product.mjs
          node docs/scripts/inject-seo.mjs

      - name: Validate documentation links and SEO
        run: |
          node --test docs/scripts/build-product.test.mjs
          node docs/scripts/check-links.mjs
          node docs/scripts/check-seo.mjs

      - name: Upload docs artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
