apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "eventore.fullname" . }}-frontend
  labels:
    {{- include "eventore.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  replicas: {{ .Values.frontend.replicaCount }}
  selector:
    matchLabels:
      {{- include "eventore.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: frontend
  template:
    metadata:
      labels:
        {{- include "eventore.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: frontend
    spec:
      {{- if include "eventore.frontendApiTokenFromSecret" . }}
      initContainers:
        - name: inject-frontend-api-token
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              TOKEN="$(cat /token/{{ .Values.frontend.env.apiTokenSecretKey }})"
              cat > /config-out/frontend-config.js <<EOF
              window.__EVENTORE_CONFIG__ = {
                apiBaseUrl: {{ .Values.frontend.env.apiBaseUrl | quote }},
                wsUrl: {{ default (printf "wss://%s/ws/stream" .Values.ingress.host) .Values.frontend.env.wsUrl | quote }},
                apiToken: "${TOKEN}"
              };
              EOF
          volumeMounts:
            - name: frontend-config-writable
              mountPath: /config-out
            - name: frontend-api-token
              mountPath: /token
              readOnly: true
      {{- end }}
      containers:
        - name: frontend
          image: "{{ .Values.image.frontend.repository }}:{{ .Values.image.frontend.tag }}"
          imagePullPolicy: {{ .Values.image.frontend.pullPolicy }}
          ports:
            - containerPort: {{ .Values.frontend.service.port }}
          env:
            - name: EVENTORE_BACKEND_HOST
              value: {{ include "eventore.fullname" . }}-backend
            - name: EVENTORE_BACKEND_PORT
              value: {{ .Values.backend.service.port | quote }}
            - name: EVENTORE_API_BASE_URL
              value: {{ .Values.frontend.env.apiBaseUrl | quote }}
            - name: EVENTORE_WS_URL
              value: {{ default (printf "wss://%s/ws/stream" .Values.ingress.host) .Values.frontend.env.wsUrl | quote }}
          volumeMounts:
            - name: {{ if include "eventore.frontendApiTokenFromSecret" . }}frontend-config-writable{{ else }}frontend-config{{ end }}
              mountPath: /usr/share/nginx/html/eventore-config.js
              subPath: frontend-config.js
          readinessProbe:
            httpGet:
              path: /
              port: {{ .Values.frontend.service.port }}
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: {{ .Values.frontend.service.port }}
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}
      volumes:
        {{- if include "eventore.frontendApiTokenFromSecret" . }}
        - name: frontend-config-writable
          emptyDir: {}
        - name: frontend-api-token
          secret:
            secretName: {{ .Values.frontend.env.apiTokenExistingSecret }}
        {{- else }}
        - name: frontend-config
          configMap:
            name: {{ include "eventore.fullname" . }}-config
            items:
              - key: frontend-config.js
                path: frontend-config.js
        {{- end }}
