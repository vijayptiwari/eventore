{{- if .Values.secrets.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "eventore.fullname" . }}-broker
  labels:
    {{- include "eventore.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $key, $value := .Values.secrets.brokerCredentials }}
  {{ $key }}: {{ $value | quote }}
  {{- else }}
  kafka-username: ""
  kafka-password: ""
  mqtt-username: ""
  mqtt-password: ""
  {{- end }}
{{- end }}
