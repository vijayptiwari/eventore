{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "eventore.fullname" . }}-backend-egress
  labels:
    {{- include "eventore.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "eventore.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: backend
  policyTypes:
    - Egress
  egress:
    - ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 80
    {{- range .Values.networkPolicy.brokerCidrs }}
    - to:
        - ipBlock:
            cidr: {{ . }}
      ports:
        - protocol: TCP
          port: 9092
        - protocol: TCP
          port: 1883
        - protocol: TCP
          port: 61616
        - protocol: TCP
          port: 6650
        - protocol: TCP
          port: 5672
        - protocol: TCP
          port: 8080
        {{- range $.Values.networkPolicy.extraBrokerPorts }}
        - protocol: TCP
          port: {{ . }}
        {{- end }}
    {{- end }}
{{- end }}
