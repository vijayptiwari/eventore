apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "eventore.fullname" . }}-config
  labels:
    {{- include "eventore.labels" . | nindent 4 }}
data:
  SPRING_APPLICATION_JSON: |
    {
      "eventore": {
        "deployment-mode": {{ .Values.eventore.deploymentMode | quote }},
        "enabled-protocols": {{ include "eventore.enabledProtocolsCsv" . | quote }},
        "control-plane": {
          "auto-register-on-startup": {{ .Values.eventore.controlPlane.autoRegisterOnStartup }}
        },
        "data-plane": {
          "require-control-plane-registration": {{ .Values.eventore.dataPlane.requireControlPlaneRegistration }}
        },
        "subscriptions": {
          "max-concurrent": {{ .Values.eventore.subscriptions.maxConcurrent }},
          "queue-capacity": {{ .Values.eventore.subscriptions.queueCapacity }}
        },
        "diagnostics": {
          "error-subscription-threshold": {{ .Values.eventore.diagnostics.errorSubscriptionThreshold }}
        },
        "connections": {
          "persistence": {
            "enabled": {{ .Values.eventore.connections.persistence.enabled }},
            "file-path": {{ .Values.eventore.connections.persistence.filePath | quote }}
          }
        },
        "dev": {
          "max-publish-bytes": {{ .Values.eventore.dev.maxPublishBytes }},
          "allowed-protocols": {{ .Values.eventore.streamProviders | toJson }}
        },
        "security": {
          "allowed-origins": {{ .Values.eventore.security.allowedOrigins | quote }}
        }
      }
    }
  frontend-config.js: |
    window.__EVENTORE_CONFIG__ = {
      apiBaseUrl: {{ .Values.frontend.env.apiBaseUrl | quote }},
      wsUrl: {{ default (printf "wss://%s/ws/stream" .Values.ingress.host) .Values.frontend.env.wsUrl | quote }}{{ if include "eventore.frontendApiToken" . }},
      apiToken: {{ .Values.frontend.env.apiToken | quote }}{{ end }}
    };
