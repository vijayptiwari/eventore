apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "eventore.fullname" . }}-backend
  labels:
    {{- include "eventore.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  replicas: {{ .Values.backend.replicaCount }}
  selector:
    matchLabels:
      {{- include "eventore.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: backend
  template:
    metadata:
      labels:
        {{- include "eventore.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: backend
    spec:
      containers:
        - name: backend
          image: "{{ .Values.image.backend.repository }}:{{ .Values.image.backend.tag }}"
          imagePullPolicy: {{ .Values.image.backend.pullPolicy }}
          ports:
            - containerPort: {{ .Values.backend.service.port }}
          env:
            - name: EVENTORE_DEPLOYMENT_MODE
              valueFrom:
                configMapKeyRef:
                  name: {{ include "eventore.fullname" . }}-config
                  key: EVENTORE_DEPLOYMENT_MODE
            - name: SPRING_APPLICATION_JSON
              valueFrom:
                configMapKeyRef:
                  name: {{ include "eventore.fullname" . }}-config
                  key: APPLICATION_YAML
          envFrom:
            - secretRef:
                name: {{ include "eventore.fullname" . }}-broker
                optional: true
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: {{ .Values.backend.service.port }}
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: {{ .Values.backend.service.port }}
            initialDelaySeconds: 30
            periodSeconds: 15
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
