apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "eventore.fullname" . }}-backend
  labels:
    {{- include "eventore.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  replicas: {{ .Values.backend.replicaCount }}
  selector:
    matchLabels:
      {{- include "eventore.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: backend
  template:
    metadata:
      labels:
        {{- include "eventore.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: backend
    spec:
      containers:
        - name: backend
          image: "{{ .Values.image.backend.repository }}:{{ include "eventore.backendImageTag" . }}"
          imagePullPolicy: {{ .Values.image.backend.pullPolicy }}
          ports:
            - containerPort: {{ .Values.backend.service.port }}
          env:
            - name: SPRING_APPLICATION_JSON
              valueFrom:
                configMapKeyRef:
                  name: {{ include "eventore.fullname" . }}-config
                  key: SPRING_APPLICATION_JSON
            {{- if include "eventore.apiAuthEnabled" . }}
            - name: EVENTORE_SECURITY_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "eventore.apiAuthSecretName" . }}
                  key: {{ .Values.eventore.security.apiTokenSecretKey }}
            {{- end }}
          envFrom:
            - secretRef:
                name: {{ include "eventore.fullname" . }}-broker
                optional: true
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: {{ .Values.backend.service.port }}
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: {{ .Values.backend.service.port }}
            initialDelaySeconds: 30
            periodSeconds: 15
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
          {{- if .Values.eventore.connections.persistence.enabled }}
          volumeMounts:
            - name: connection-data
              mountPath: /data
          {{- end }}
      {{- if .Values.eventore.connections.persistence.enabled }}
      volumes:
        - name: connection-data
          emptyDir: {}
      {{- end }}
