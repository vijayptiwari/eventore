global:
  imageRegistry: ghcr.io/vijayptiwari

# Required: which stream providers this deployment uses. Drives backend image tag and runtime config.
# Examples: [KAFKA] → <version>-kafka  |  [KAFKA, KINESIS] → <version>-kafka-kinesis  |  all eight → <version>-all
# Published image suffixes: kafka, mqtt, jms, pulsar, rabbitmq, kinesis, gcp-pubsub, azure-servicebus,
#   plus bundles kafka-kinesis and all (see deploy/ci-backend-images.json).
eventore:
  streamProviders:
    - KAFKA
  deploymentMode: DEV
  controlPlane:
    autoRegisterOnStartup: true
  dataPlane:
    requireControlPlaneRegistration: true
  subscriptions:
    maxConcurrent: 50
    queueCapacity: 500
  diagnostics:
    errorSubscriptionThreshold: 5
  connections:
    persistence:
      enabled: false
      filePath: /data/connections.json
      # emptyDir survives container restart only; use pvc for pod reschedule durability
      volumeType: emptyDir
      existingClaim: ""
      storageClass: ""
      size: 1Gi
  dev:
    maxPublishBytes: 1048576
  # API token auth (production). Prefer apiTokenExistingSecret over inline apiToken.
  security:
    apiToken: ""
    apiTokenExistingSecret: ""
    apiTokenSecretKey: api-token
    allowedOrigins: "*"

image:
  backend:
    repository: ghcr.io/vijayptiwari/eventore-backend
    tag: ""  # empty = Chart.appVersion + provider suffix (e.g. 0.2.1-kafka)
    pullPolicy: IfNotPresent
  frontend:
    repository: ghcr.io/vijayptiwari/eventore-frontend
    tag: ""  # defaults to Chart.appVersion for reproducible releases
    pullPolicy: IfNotPresent

backend:
  replicaCount: 1
  service:
    port: 8080
  resources: {}

frontend:
  replicaCount: 1
  service:
    port: 80
  resources: {}
  env:
    apiBaseUrl: /api/v1
    wsUrl: ""
    # Optional dev convenience — prefer Settings UI + sessionStorage in production.
    apiToken: ""
    apiTokenExistingSecret: ""
    apiTokenSecretKey: api-token

ingress:
  enabled: true
  className: ""
  host: eventore.local
  annotations: {}
  sessionAffinity:
    enabled: false
    cookieName: eventore-affinity

networkPolicy:
  enabled: false
  brokerCidrs: []
  extraBrokerPorts: []

secrets:
  create: true
  brokerCredentials: {}

podDisruptionBudget:
  enabled: false
  minAvailable: 1
