global:
  imageRegistry: ghcr.io/vijayptiwari

eventore:
  deploymentMode: DEV
  enabledProtocols: ""
  controlPlane:
    autoRegisterOnStartup: true
  dataPlane:
    requireControlPlaneRegistration: true
  subscriptions:
    maxConcurrent: 50
    queueCapacity: 500
  dev:
    maxPublishBytes: 1048576
    allowedProtocols:
      - KAFKA
      - MQTT
      - JMS
      - PULSAR
      - RABBITMQ
      - KINESIS
      - GCP_PUBSUB
      - AZURE_SERVICE_BUS

image:
  backend:
    repository: ghcr.io/vijayptiwari/eventore-backend
    tag: "0.1.0"
    pullPolicy: IfNotPresent
  frontend:
    repository: ghcr.io/vijayptiwari/eventore-frontend
    tag: "0.1.0"
    pullPolicy: IfNotPresent

backend:
  replicaCount: 1
  service:
    port: 8080
  resources: {}

frontend:
  replicaCount: 1
  service:
    port: 80
  resources: {}
  env:
    apiBaseUrl: /api/v1
    wsUrl: ""

ingress:
  enabled: true
  className: ""
  host: eventore.local
  annotations: {}

secrets:
  create: true
  brokerCredentials: {}

networkPolicy:
  enabled: false
  brokerCidrs: []

podDisruptionBudget:
  enabled: false
  minAvailable: 1
