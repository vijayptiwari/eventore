global:
  imageRegistry: ghcr.io/vijayptiwari

# Required: which stream providers this deployment uses. Drives backend image tag and runtime config.
# Examples: [KAFKA]  |  [KAFKA, KINESIS] → image tag kafka-kinesis  |  all eight → tag all
# Published image tags: kafka, mqtt, jms, pulsar, rabbitmq, kinesis, gcp-pubsub, azure-servicebus,
#   plus bundles kafka-kinesis and all (see deploy/ci-backend-images.json).
eventore:
  streamProviders:
    - KAFKA
  deploymentMode: DEV
  controlPlane:
    autoRegisterOnStartup: true
  dataPlane:
    requireControlPlaneRegistration: true
  subscriptions:
    maxConcurrent: 50
    queueCapacity: 500
  diagnostics:
    errorSubscriptionThreshold: 5
  connections:
    persistence:
      enabled: false
      filePath: /data/connections.json
  dev:
    maxPublishBytes: 1048576
  # API token auth (production). Prefer apiTokenExistingSecret over inline apiToken.
  security:
    apiToken: ""
    apiTokenExistingSecret: ""
    apiTokenSecretKey: api-token
    allowedOrigins: "*"

image:
  backend:
    repository: ghcr.io/vijayptiwari/eventore-backend
    tag: ""  # empty = derive from eventore.streamProviders (e.g. kafka, kafka-kinesis, all)
    pullPolicy: IfNotPresent
  frontend:
    repository: ghcr.io/vijayptiwari/eventore-frontend
    tag: "latest"
    pullPolicy: IfNotPresent

backend:
  replicaCount: 1
  service:
    port: 8080
  resources: {}

frontend:
  replicaCount: 1
  service:
    port: 80
  resources: {}
  env:
    apiBaseUrl: /api/v1
    wsUrl: ""
    # Optional dev convenience — prefer Settings UI + sessionStorage in production.
    apiToken: ""
    apiTokenExistingSecret: ""
    apiTokenSecretKey: api-token

ingress:
  enabled: true
  className: ""
  host: eventore.local
  annotations: {}

secrets:
  create: true
  brokerCredentials: {}

networkPolicy:
  enabled: false
  brokerCidrs: []

podDisruptionBudget:
  enabled: false
  minAvailable: 1
