eventore:
  streamProviders:
    - KAFKA
  deploymentMode: READONLY
  subscriptions:
    maxConcurrent: 25

backend:
  replicaCount: 2

frontend:
  replicaCount: 2

podDisruptionBudget:
  enabled: true
  minAvailable: 1

# READONLY SRE dashboards often pair with API token auth:
# eventore:
#   security:
#     apiTokenExistingSecret: eventore-api-token
#     allowedOrigins: "https://eventore.local"
