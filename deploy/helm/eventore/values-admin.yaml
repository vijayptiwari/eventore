eventore:
  streamProviders:
    - KAFKA
    - MQTT
    - JMS
    - PULSAR
    - RABBITMQ
    - KINESIS
    - GCP_PUBSUB
    - AZURE_SERVICE_BUS
  deploymentMode: ADMIN
  subscriptions:
    maxConcurrent: 100

ingress:
  enabled: true
  annotations:
    nginx.ingress.kubernetes.io/auth-type: basic
    nginx.ingress.kubernetes.io/auth-secret: eventore-admin-basic-auth
    nginx.ingress.kubernetes.io/auth-realm: "Eventore Admin"

networkPolicy:
  enabled: false

# Production security (uncomment and create Secret before exposing ingress):
# eventore:
#   security:
#     apiTokenExistingSecret: eventore-api-token
#     apiTokenSecretKey: api-token
#     allowedOrigins: "https://eventore.local"
# frontend:
#   env:
#     # Prefer UI Settings → API token; inline token is dev-only.
#     apiToken: ""
