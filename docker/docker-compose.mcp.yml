# Optional: run MCP layer separately (requires Eventore backend reachable)
services:
  eventore-mcp:
    build:
      context: ..
      dockerfile: docker/Dockerfile.mcp
    ports:
      - "3100:3100"
    environment:
      MCP_TRANSPORT: http
      MCP_PORT: "3100"
      EVENTORE_API_URL: http://host.docker.internal:8080/api/v1
      # MCP_AUTH_TOKEN: your-secret-token
